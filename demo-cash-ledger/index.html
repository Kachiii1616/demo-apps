<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お金管理（デモ版）</title>
  <script>
    // 着せ替え: 描画前に保存済みのテーマを当てる（キー showcase-cash:theme）
    (function () {
      var t = 'standard';
      try { t = localStorage.getItem('showcase-cash:theme') || t; } catch (e) {}
      if (t !== 'wamodern' && t !== 'simple') t = 'standard';
      document.documentElement.setAttribute('data-theme', t);
      // 標準・和モダンの本文書体（「シンプル」はシステム標準の書体だけなので読み込まない）
      window.__cashBaseFonts = function () {
        if (document.getElementById('baseFonts')) return;
        var l = document.createElement('link');
        l.id = 'baseFonts';
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap';
        document.head.appendChild(l);
      };
      if (t !== 'simple') window.__cashBaseFonts();
      window.__cashThemeFonts = function () {
        if (document.getElementById('waFonts')) return;
        var l = document.createElement('link');
        l.id = 'waFonts';
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Allura&display=swap';
        document.head.appendChild(l);
      };
      if (t === 'wamodern') window.__cashThemeFonts();
    })();
  </script>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./theme-wa.css">
  <link rel="stylesheet" href="./theme-simple.css">
</head>
<body>
  <div class="demo-bar no-print">
    <a class="demo-back" href="../demo-portal/">← デモ一覧へ</a>
    <span class="demo-note">デモ版（データは架空です。保存先はこのブラウザ内だけ）</span>
    <button type="button" class="demo-reset" id="demoReset">デモデータを初期状態に戻す</button>
  </div>

  <header class="app-head no-print">
    <div class="app-head-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 32 24" width="34" height="26"><rect x="1" y="2" width="30" height="20" rx="4" fill="currentColor"/><rect x="1" y="7" width="30" height="3" fill="#fff" opacity=".35"/><rect x="5" y="14" width="9" height="2.4" rx="1.2" fill="#fff"/><circle cx="23" cy="15.2" r="3.4" fill="none" stroke="#fff" stroke-width="2"/></svg>
        </span>
        <div>
          <div class="brand-ruby">げんきん すいとう</div>
          <div class="brand-name">お金管理</div>
        </div>
      </div>
      <div class="head-meta">
        <div class="facility" id="facilityName"></div>
        <div class="today" id="todayLabel"></div>
        <label class="theme-pick">着せ替え
          <select id="themeSel" aria-label="着せ替え（画面のデザイン）">
            <option value="standard">標準</option>
            <option value="wamodern">和モダン</option>
            <option value="simple">シンプル</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <div class="modal-back" id="modalBack" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal"></div>
  </div>
  <div class="modal-back confirm-back" id="confirmBack" hidden>
    <div class="modal confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmMsg">
      <p id="confirmMsg" class="confirm-msg"></p>
      <div class="modal-actions">
        <button type="button" class="btn primary lg" id="confirmOk">OK</button>
        <button type="button" class="btn lg" id="confirmCancel">やめる</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
