<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記録アプリ（デモ版）</title>
  <link rel="icon" href="data:,">
  <script>
    // 着せ替えを描画前に決める。「シンプル」のときは Web フォントを読み込まない
    (function () {
      var th = 'standard';
      try { th = JSON.parse(localStorage.getItem('showcase-record:prefs') || '{}').theme || 'standard'; } catch (e) { /* 既定のまま */ }
      window.__showcaseTheme = th;
      window.__loadWebFonts = function () {
        if (document.getElementById('webfonts')) return;
        var l = document.createElement('link');
        l.id = 'webfonts'; l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Pacifico&family=Dancing+Script:wght@600&family=Klee+One:wght@400;600&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@400;500;700&display=swap';
        document.head.appendChild(l);
      };
      if (th !== 'simple') window.__loadWebFonts();
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme-simple.css">
</head>
<body>
  <script>document.body.dataset.theme = window.__showcaseTheme || 'standard';</script>
  <div class="demo-bar">
    <a href="../demo-portal/">← デモ一覧へ</a>
    <strong>デモ版（データは架空です）</strong>
    <button type="button" id="reset-demo">デモデータを初期状態に戻す</button>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="メニュー">
      <div class="brand">
        <div class="brand-text">
          <div class="brand-title">記録アプリ</div>
          <div class="brand-sub"><span id="facility-name"></span><button type="button" class="pill-tag" id="facility-change">変更</button></div>
        </div>
        <button type="button" class="collapse-btn" id="collapse" aria-label="メニューを折りたたむ"></button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button type="button" class="design-btn" id="design-btn">デザイン: スタンダード</button>
      </div>
      <div class="me">
        <div class="avatar" id="me-avatar"></div>
        <div class="me-text">
          <select id="me-select" aria-label="ログイン中の職員（デモ用に切り替えできます）"></select>
          <div class="me-sub">ログイン中</div>
        </div>
        <button type="button" class="logout" id="logout" aria-label="ログアウト"></button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <button type="button" class="menu-btn" id="open-menu" aria-label="メニューを開く"></button>
      <div id="view"></div>
    </main>
  </div>

  <a class="help-fab no-print" href="#/help">ヘルプ</a>
  <div class="modal-wrap" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
