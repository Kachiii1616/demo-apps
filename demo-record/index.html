<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記録アプリ（デモ版）</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="demo-bar">
    <a href="../demo-portal/">← デモ一覧へ</a>
    <strong>デモ版（データは架空です）</strong>
    <button type="button" id="reset-demo">デモデータを初期状態に戻す</button>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="メニュー">
      <div class="brand">
        <div class="brand-text">
          <div class="brand-title">記録アプリ</div>
          <div class="brand-sub"><span id="facility-name"></span><button type="button" class="pill-tag" id="facility-change">変更</button></div>
        </div>
        <button type="button" class="collapse-btn" id="collapse" aria-label="メニューを折りたたむ"></button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button type="button" class="design-btn" id="design-btn">デザイン: スタンダード</button>
      </div>
      <div class="me">
        <div class="avatar" id="me-avatar"></div>
        <div class="me-text">
          <select id="me-select" aria-label="ログイン中の職員（デモ用に切り替えできます）"></select>
          <div class="me-sub">ログイン中</div>
        </div>
        <button type="button" class="logout" id="logout" aria-label="ログアウト"></button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <button type="button" class="menu-btn" id="open-menu" aria-label="メニューを開く"></button>
      <div id="view"></div>
    </main>
  </div>

  <a class="help-fab no-print" href="#/help">ヘルプ</a>
  <div class="modal-wrap" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
