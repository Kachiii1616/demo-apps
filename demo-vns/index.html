<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>訪問看護記録アプリ（デモ版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="demo-bar">
  <a href="../demo-portal/">← デモ一覧へ</a>
  <strong>デモ版（データは架空です）</strong>
  <button type="button" id="resetDemo">デモデータを初期状態に戻す</button>
</div>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-name">訪問看護記録アプリ</div>
      <div class="brand-sub">記録・予定・指示書をひとつに</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-user">
      <div class="side-user-name" id="sideUser"></div>
      <div class="muted small">nurse@example.com</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="メニュー">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <h1 id="pageTitle">ダッシュボード</h1>
      <div class="station"><span class="muted">事業所:</span> <b id="stationName"></b></div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal-wrap" id="modal" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
