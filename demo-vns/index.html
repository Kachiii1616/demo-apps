<!doctype html>
<html lang="ja" data-theme="sakura">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訪問看護アプリ（デモ版）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b65a82'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme-rose.css">
  <link rel="stylesheet" href="theme-simple.css">
  <script>
    // 描画前に着せ替えを当てる。Google Fonts は「シンプル」以外のときだけ読み込む（シンプルでは通信しない）。
    window.showcaseLoadFonts = function () {
      if (document.getElementById('gfonts')) return;
      var l = document.createElement('link');
      l.id = 'gfonts'; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap';
      document.head.appendChild(l);
    };
    try { var t = localStorage.getItem('showcase-vns:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    if (document.documentElement.dataset.theme !== 'simple') window.showcaseLoadFonts();
  </script>
</head>
<body>
  <div class="demo-bar no-print">
    <a href="../demo-portal/">← デモ一覧へ</a>
    <strong>デモ版（データは架空です）</strong>
    <button type="button" id="reset-demo">デモデータを初期状態に戻す</button>
  </div>

  <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-2" aria-hidden="true"></div>
  <!-- 着せ替え「ローズゴールド」用の水彩・筆のにじみ（他の着せ替えでは使わない） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rose-wc" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="5"/><feDisplacementMap in="SourceGraphic" scale="70" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="rose-brush" x="-5%" y="-30%" width="110%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.015 0.35" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
  </svg>

  <header class="topbar">
    <button type="button" class="hamburger no-print" id="open-menu" aria-label="メニューを開く"><span></span><span></span><span></span></button>
    <div class="brand" id="brand-name">訪問看護ステーション</div>
    <div class="crumb" id="crumb"></div>
    <div class="top-actions no-print" id="top-actions"></div>
  </header>

  <nav class="drawer" id="drawer" aria-label="メニュー" hidden>
    <button type="button" class="pill-sm" id="close-menu" aria-label="メニューを閉じる">× 閉じる</button>
    <div class="drawer-items" id="drawer-items"></div>
  </nav>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

  <div class="rose-band" aria-hidden="true"><span>with care, every visit</span></div>

  <main class="sheet">
    <div class="notice no-print">デモ版です。表示中の利用者・職員・連絡先はすべて架空のサンプルです。入力内容はこの端末のブラウザにだけ保存されます。実際の個人情報は入力しないでください。</div>
    <div id="view"></div>
  </main>

  <div class="modal-wrap" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
