<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9d3de">
<title>こころノート（デモ版）</title>
<script>
  // 着せ替えを描画前に決める（標準 / シンプル）。シンプルのときは Web フォントを読み込まない
  (function () {
    var th = 'standard';
    try { th = localStorage.getItem('showcase-cbt:theme') === 'simple' ? 'simple' : 'standard'; } catch (e) { /* 既定のまま */ }
    document.documentElement.dataset.theme = th;
    window.__loadWebFonts = function () {
      if (document.getElementById('webfonts')) return;
      var l = document.createElement('link');
      l.id = 'webfonts'; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap';
      document.head.appendChild(l);
    };
    if (th !== 'simple') window.__loadWebFonts();
    else document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
  })();
</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-simple.css">
</head>
<body>
<div class="demo-band" role="note">
  <a href="../demo-portal/">← デモ一覧へ</a>
  <span>デモ版（データは架空です）</span>
  <button type="button" id="resetDemo">デモデータを初期状態に戻す</button>
</div>

<div class="sky" aria-hidden="true">
  <svg class="orbits" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice">
    <ellipse cx="190" cy="270" rx="240" ry="200" />
    <ellipse cx="140" cy="720" rx="300" ry="170" transform="rotate(12 140 720)" />
  </svg>
  <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">·</span>
  <span class="moon"></span>
</div>

<div class="shell">
  <header class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><path d="M20.5 25.5A10.5 10.5 0 0 1 13 6a11 11 0 1 0 13.5 15.5 10.4 10.4 0 0 1-6 4Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M23 7.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="currentColor"/></svg>
    </div>
    <div>
      <div class="brand-ja">こころノート</div>
      <div class="brand-en">Kokoro Note</div>
    </div>
    <div class="brand-date" id="todayLabel"></div>
  </header>

  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="メインメニュー">
  <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z"/></svg><span>ホーム</span></a>
  <a href="#/column" data-tab="column"><svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6Z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></svg><span>コラム</span></a>
  <a href="#/action" data-tab="action"><svg viewBox="0 0 24 24"><circle cx="12.5" cy="4.5" r="1.8"/><path d="m9.5 21 2.5-7 2.5 2.5V21M12 14l.5-5.5L9 10.5V13M12.5 8.5l2.5 3 2.5 1"/></svg><span>行動</span></a>
  <a href="#/review" data-tab="review"><svg viewBox="0 0 24 24"><path d="M4 20h16M5 16l4.5-4.5 3 2.5L19 7.5"/><circle cx="19" cy="7.5" r="1.2"/></svg><span>振り返り</span></a>
  <a href="#/learn" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Zm0 0V20"/></svg><span>学ぶ</span></a>

</html>
