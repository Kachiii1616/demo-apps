<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シフト管理（デモ版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Kaushan+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="demo-bar no-print">
  <a href="../demo-portal/">← デモ一覧へ</a>
  <strong>デモ版（データは架空です）</strong>
  <button type="button" id="resetDemo">デモデータを初期状態に戻す</button>
</div>

<header class="app-head no-print">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="7.5" r="5.5" fill="#f6c97f"/><circle cx="24.5" cy="16" r="5.5" fill="#f3b38f"/>
      <circle cx="16" cy="24.5" r="5.5" fill="#f6c97f"/><circle cx="7.5" cy="16" r="5.5" fill="#f3b38f"/>
      <circle cx="16" cy="16" r="4.5" fill="#e8806a"/>
    </svg>
    <span class="brand-script">Shift</span><span class="brand-ja">シフト管理</span>
    <span class="facility-pill" id="facilityName"></span>
  </div>
  <div class="head-user" id="headUser"></div>
</header>
<nav class="tabs no-print" id="tabs">
  <a href="#/month" data-route="month">月シフト</a>
  <a href="#/daily" data-route="daily">1日業務分担表</a>
  <a href="#/requests" data-route="requests">休み希望</a>
  <a href="#/calendar" data-route="calendar">カレンダー</a>
  <a href="#/settings" data-route="settings">職員・勤務区分</a>
</nav>

<main id="view"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
